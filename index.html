<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sesshuu design — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Sans+JP:wght@300;400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --crimson: #C8184A;
      --navy: #0F1629;
      --navy-mid: #1A2340;
      --sky: #7BAAB8;
      --white: #FAFAF8;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--navy);
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }
    .container {
      text-align: center;
      max-width: 560px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--white);
      margin-bottom: 8px;
    }
    .logo em {
      color: var(--crimson);
      font-style: italic;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: var(--crimson);
      margin: 24px auto;
    }
    .status {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--sky);
      margin-bottom: 20px;
    }
    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 300;
      line-height: 1.4;
      color: var(--white);
      margin-bottom: 20px;
    }
    .heading em {
      color: var(--crimson);
      font-style: italic;
    }
    .message {
      font-size: 13px;
      font-weight: 300;
      color: rgba(250, 250, 248, 0.55);
      line-height: 2.0;
      margin-bottom: 40px;
    }
    .footer {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: rgba(250, 250, 248, 0.2);
      margin-top: 48px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">sesshuu <em>design</em></div>
    <div class="divider"></div>
    <div class="status">Under Maintenance</div>
    <h1 class="heading">ただいま<br><em>整備中</em>です。</h1>
    <p class="message">
      より良いコンテンツをお届けするため、<br>
      ポートフォリオサイトを更新中です。<br>
      しばらくお待ちください。
    </p>
    <div class="footer">© 2026 文月雪舟 / sesshuu design</div>
  </div>
</body>
</html>
